version: 2
updates:
  # Python dependencies: Dependabot reads uv.lock, so every PR is a lockfile
  # change (security floors live in pyproject.toml `[tool.uv].constraint-dependencies`).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    reviewers:
      - remcov

  - package-ecosystem: github-actions
    directory: .github/workflows
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    reviewers:
      - remcov

  # Base images are pinned by digest; Dependabot proposes digest bumps.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    reviewers:
      - remcov
