name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          version: "0.11.6"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache uv dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}

      - name: Verify lockfile is up to date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Run Ruff linter
        run: uv run ruff check src/ tests/

      - name: Check code formatting with Black
        run: uv run black --check src/ tests/

      - name: Run tests
        # README.md says CI runs the suite with warnings as errors; without the
        # flag a resource leak or deprecation warning merged green (#117).
        run: uv run pytest -v --tb=short -W error --cov=src/traktor --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Security scanning job
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install Bandit
        run: pip install bandit==1.9.4

      - name: Run Bandit security linter (fails on medium+ severity, medium+ confidence)
        run: bandit -r src/ -f json -o bandit-report.json -ll -ii

      - name: Upload security report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json

  # Dependency vulnerability scanning (advisory floors live in pyproject.toml
  # `[tool.uv].constraint-dependencies`).
  dependency-audit:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6

      - name: Export locked dependencies
        # --no-emit-project: pip-audit installs with hash checking enabled and
        # rejects the editable `-e .` entry that has no hash.
        run: uv export --frozen --no-emit-project --format requirements-txt --output-file requirements-audit.txt

      - name: Run pip-audit against locked dependencies
        run: |
          python -m pip install --upgrade pip 'pip-audit==2.10.1'
          python -m pip_audit -r requirements-audit.txt --strict

  # Validate workflow files themselves (issue #8 follow-up)
  action-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install actionlint (pinned, checksum verified)
        # The installer script used to be fetched and executed on every run, so
        # a change upstream ran here with this repository's token. The release
        # artifact is downloaded and its published SHA-256 checked before it is
        # unpacked and executed (issue #18).
        run: |
          version=1.7.9
          archive="actionlint_${version}_linux_amd64.tar.gz"
          curl -sSfLo "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          echo "233b280d05e100837f4af1433c7b40a5dcb306e3aa68fb4f17f8a7f45a7df7b4  ${archive}" | sha256sum -c -
          tar -xzf "$archive" actionlint

      - name: Run actionlint
        run: ./actionlint -color
