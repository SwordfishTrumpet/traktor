name: Dependency Review

# dependency-review-action requires a pull_request context (base vs head ref)
# and cannot run on direct pushes - see CI failure on push to main.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  # Required by comment-summary-in-pr
  issues: write
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48  # v4.9.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: true

  # Check for outdated dependencies
  outdated-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: "0.11.6"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"

      - name: Check for outdated dependencies
        run: |
          uv pip list --outdated || echo "Could not check for outdated dependencies"
        continue-on-error: true
