name: Release

# A `v*` tag is the release. This workflow tests the tree, builds the wheel and
# sdist, and attaches them to the GitHub Release it creates. That release is the
# distribution channel: nothing is published to PyPI, so there is no package
# index account, token or trusted publisher to configure.

# workflow_dispatch: RUNBOOK.md recovers a broken release with
# `gh workflow run release.yml --ref v<version>`, which needs a dispatchable
# trigger or GitHub answers 422 (issue #90).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          version: "0.11.6"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest

      - name: Build package
        run: uv build

      - name: Generate release notes
        id: release_notes
        run: |
          # Extract changelog section for this version
          VERSION=${GITHUB_REF_NAME#v}
          # Copy one changelog section: from its "## [<version>]" heading up to the next
          # "## [" heading. The previous version tested for the end of the section on the
          # same line it matched, so it exited immediately and the release body carried
          # the heading alone (found on v1.1.1).
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 {found=1; print; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > RELEASE_NOTES.md || echo "See CHANGELOG.md for details" > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md || echo "See CHANGELOG.md for details" > RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
