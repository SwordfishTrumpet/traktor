services:
  traktor:
    # `build: .` is what makes `docker compose build` produce the image named
    # below; with only an image name, compose reported "No services to build"
    # and the run step failed with "No such image" (issue #57).
    build: .
    image: traktor:test
    container_name: traktor
    
    # Environment variables - set these or use .env file
    environment:
      # Required: Plex configuration
      - PLEX_URL=${PLEX_URL}
      - PLEX_TOKEN=${PLEX_TOKEN}
      
      # Required: Trakt API credentials
      - TRAKT_CLIENT_ID=${TRAKT_CLIENT_ID}
      - TRAKT_CLIENT_SECRET=${TRAKT_CLIENT_SECRET}
      
      # Optional: Trakt tokens (will be auto-generated on first run)
      - TRAKT_ACCESS_TOKEN=${TRAKT_ACCESS_TOKEN:-}
      - TRAKT_REFRESH_TOKEN=${TRAKT_REFRESH_TOKEN:-}
      
      # Docker mode (do not change)
      - DOCKER_MODE=true
      
      # Optional: Additional settings
      - PYTHONUNBUFFERED=1
    
    # Volume mounts for persistent data. Everything DOCKER_MODE writes under
    # /data lives under one mount: config, cache, logs, the watch-sync delta
    # file and the undo snapshots. Mounting only /data/logs and /data/config
    # threw the delta file and the snapshots away with the container (issue #87).
    volumes:
      # Mount your .env file (not read-only so tokens can be saved)
      - ./.env:/app/.env

      # Config, cache, logs and watch-sync state
      - ./data:/data

      # Snapshots default to the container home; without this mount every
      # backup disappears when `docker compose run --rm` exits (issue #87).
      - ./data/backups:/home/traktor/.traktor_backups
    
    # Interactive mode for authentication prompts
    stdin_open: true
    tty: true
    
    # Restart policy
    restart: "no"
    
    # Health check
    healthcheck:
      # The container is unhealthy when its config cannot be read, which is
      # what --health-check answers and --diagnose did not (issue #116).
      test: ["CMD", "uv", "run", "traktor", "--health-check"]
      interval: 1m
      timeout: 30s
      retries: 3
      start_period: 10s
    
    # Networks (use host network if Plex is on same host)
    # network_mode: host
    networks:
      - traktor-network

networks:
  traktor-network:
    driver: bridge
