[project]
name = "traktor"
version = "1.1.0"
description = "Sync liked Trakt lists into Plex playlists with cache-assisted matching"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "SwordfishTrumpet"}
]
keywords = ["plex", "trakt", "playlists", "automation", "media"]
dependencies = [
    "plexapi>=4.18.2",
    "requests>=2.34.2",
    "python-dotenv>=1.0.0",
    # Security floor: 2026.10.19 fixes PYSEC-2026-4320.
    "certifi>=2026.10.19",
]

[project.urls]
Repository = "https://github.com/SwordfishTrumpet/traktor"
Issues = "https://github.com/SwordfishTrumpet/traktor/issues"

[project.scripts]
traktor = "traktor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
python-preference = "only-managed"
# Security floors for dependencies that are only pulled in transitively (nothing
# in src/traktor imports them). Same policy as hound/ingest: a fresh `uv lock`
# cannot resolve back below an advisory fix version.
constraint-dependencies = [
    # requests -> urllib3: 2.8.0 fixes PYSEC-2026-4175/-4176/-4177.
    "urllib3>=2.8.0",
]

[tool.uv.pip]
generate-hashes = true

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "black>=26.10.1",
    "ruff>=0.16.0",
    "mypy>=2.1",
    # Type stubs are a development-only concern; they used to sit in
    # [project].dependencies and were therefore installed in the runtime image.
    "types-psutil>=7.2.2.20260518",
    "types-requests>=2.33.0.20260518",
    "pytest-cov>=7.1.0",
    "vulture>=2.16",
]
