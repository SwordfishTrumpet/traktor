[project]
name = "traktor"
version = "1.0.0"
description = "Sync liked Trakt lists into Plex playlists with cache-assisted matching"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "SwordfishTrumpet"}
]
keywords = ["plex", "trakt", "playlists", "automation", "media"]
dependencies = [
    "plexapi>=4.18.2",
    "requests>=2.34.2",
    "python-dotenv>=1.0.0",
    "certifi>=2026.7.22",
    "types-requests>=2.33.0.20260518",
    "types-psutil>=7.2.2.20260518",
]

[project.urls]
Repository = "https://github.com/SwordfishTrumpet/traktor"
Issues = "https://github.com/SwordfishTrumpet/traktor/issues"

[project.scripts]
traktor = "traktor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
python-preference = "only-managed"

[tool.uv.pip]
generate-hashes = true

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "black>=26.0",
    "ruff>=0.16.0",
    "mypy>=2.1",
    "types-psutil>=7.2.2.20260518",
    "types-requests>=2.33.0.20260518",
]
